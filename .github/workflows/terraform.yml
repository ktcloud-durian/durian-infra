name: Terraform

on:
  pull_request:
    paths:
      - 'main/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'main/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/security-scan.yml'
      - '.tflint.hcl'
      - '.trivyignore.yaml'

  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete everything in envs/dev'
        required: true
        default: ''

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write      # OIDC to AWS
  contents: read
  pull-requests: write # plan result comment

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ap-northeast-2
  TF_DIR: main

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: fmt (warning only)
        continue-on-error: true
        run: terraform fmt -check -recursive

      - name: init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 공개 저장소: 계정 ID/리소스 ID 노출 방지를 위해 전체 plan은 로그/댓글에 남기지 않고 요약 한 줄만 남김
          # 0 = no changes, 2 = changes, 1 = error
          if [ "$code" -eq 0 ]; then
            summary="No changes."
          elif [ "$code" -eq 2 ]; then
            summary=$(grep -E '^Plan:' plan.txt | tail -1)
            summary="${summary:-Changes detected (no resource summary)}"
          else
            summary="Plan failed (exit 1). 공개 저장소라 상세 로그는 출력하지 않음. 로컬에서 terraform plan 으로 확인"
          fi
          echo "$summary"
          echo "$summary" > plan-summary.txt
          rm -f plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Comment plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = `${process.env.TF_DIR}/plan-summary.txt`;
            const body = fs.existsSync(p) ? fs.readFileSync(p, 'utf8').trim() : '(no plan output)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan (`' + process.env.TF_DIR + '`)\n' + body,
            });

  apply:
    # Safety switch: set repository variable TF_APPLY_ENABLED=true to allow apply.
    if: github.event_name == 'push' && vars.TF_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production   # approval gate (Required reviewers) + OIDC subject for the apply role
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -no-color -out=tfplan

      - name: apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -no-color tfplan

  destroy:
    # Manual only. Needs TF_APPLY_ENABLED=true, input "destroy", and production Environment approval.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'destroy' && vars.TF_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -no-color -auto-approve
