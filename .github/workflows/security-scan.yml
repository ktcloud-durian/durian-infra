# 보안 검사 (보안 기준서 SEC-01·03, PIP-01~04, NET-01·02). 담당: 보안(송윤지)
# gitleaks: 비밀키·토큰 / tflint: Terraform 문법·관례 / trivy: 위험한 설정(DB 포트 공개 등)
# main 규칙 집합에서 "Security Scan / gitleaks", "/ tflint", "/ trivy" 를 필수 상태 검사로 지정해야 병합이 막힘 (PIP-01)
name: Security Scan

on:
  pull_request:          # pull_request_target 은 쓰지 않음 (PIP-04)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read         # 읽기만 (PIP-03). AWS 접근(OIDC) 없음

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # 아래 4개는 pin-tools.sh 로 공식 checksums 파일에서 채움
  TFLINT_VERSION: "0.66.0"
  TFLINT_SHA256: "22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e"
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA 고정, PIP-02)
        with:
          fetch-depth: 0          # 과거 커밋까지 검사
          persist-credentials: false
      - name: Install gitleaks (체크섬 확인)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks git --redact -v --exit-code 1 .   # --redact: 찾은 값은 로그에 남기지 않음

  tflint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tflint (체크섬 확인)
        run: |
          set -euo pipefail
          f="tflint_linux_amd64.zip"
          curl -sSfL -o "$f" "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/${f}"
          echo "${TFLINT_SHA256}  ${f}" | sha256sum -c -
          unzip -q "$f" && sudo install -m 0755 tflint /usr/local/bin/tflint
      - name: Lint (main, bootstrap)
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # trivy-action 은 2026-03 태그 변조 사고(CVE-2026-33634)가 있어 쓰지 않고, 공식 바이너리를 체크섬으로 확인해 설치
      - name: Install trivy (체크섬 확인)
        run: |
          set -euo pipefail
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${f}"
          echo "${TRIVY_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" trivy && sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Config scan (MEDIUM 이상이면 실패)
        # 예외는 .trivyignore.yaml 에만, 줄마다 예외 대장 번호(EX-xx)와 만료일 (보안 기준서 7.1)
        run: trivy config --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml .
