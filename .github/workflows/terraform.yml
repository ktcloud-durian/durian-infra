name: Terraform
# 보안(PIP-02·PIP-05): Action은 커밋 SHA로 고정, 공개 저장소라 plan·apply 전문을 로그·PR 댓글에 남기지 않음
#   댓글 = 요약 한 줄 + 바뀌는 리소스 주소 목록 (계정 ID 12자리는 가림), 로그 = 같은 요약 + 계정 ID 마스킹

on:
  # plan은 main 규칙 집합의 필수 검사라 경로 필터를 두지 않음 (경로가 안 맞는 PR은 검사가 안 떠서 병합이 막힘)
  pull_request:
  push:
    branches: [main]
    paths:
      - 'main/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/security-scan.yml'
      - '.tflint.hcl'
      - '.trivyignore.yaml'

  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete everything in envs/dev'
        required: true
        default: ''

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write      # OIDC to AWS
  contents: read
  pull-requests: write # plan result comment

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ap-northeast-2
  TF_DIR: main
  TF_VAR_nat_enabled: ${{ vars.TF_VAR_nat_enabled }}
  TF_VAR_aws_k3s_enabled: ${{ vars.TF_VAR_aws_k3s_enabled }}
  TF_VAR_aws_k3s_network_approved: ${{ vars.TF_VAR_aws_k3s_network_approved }}
  TF_VAR_aws_k3s_bootstrap_approved: ${{ vars.TF_VAR_aws_k3s_bootstrap_approved }}
  TF_VAR_aws_k3s_version: ${{ vars.TF_VAR_aws_k3s_version }}
  TF_VAR_aws_k3s_argocd_chart_version: ${{ vars.TF_VAR_aws_k3s_argocd_chart_version }}
  TF_VAR_aws_k3s_image_registry: ${{ vars.TF_VAR_aws_k3s_image_registry }}
  TF_VAR_monitor_enabled: ${{ vars.TF_VAR_monitor_enabled }}
  TF_VAR_monitor_instance_type: ${{ vars.TF_VAR_monitor_instance_type }}
  TF_VAR_aws_alb_enabled: ${{ vars.TF_VAR_aws_alb_enabled }}
  TF_VAR_aws_alb_certificate_arn: ${{ vars.TF_VAR_aws_alb_certificate_arn }}
  TF_VAR_aws_web_domain_name: ${{ vars.TF_VAR_aws_web_domain_name }}
  TF_VAR_aws_web_route53_zone_id: ${{ vars.TF_VAR_aws_web_route53_zone_id }}
  TF_VAR_default_sg_extra_vpc_ids: ${{ vars.TF_VAR_default_sg_extra_vpc_ids }}
  TF_VAR_global_detection_enabled: ${{ vars.TF_VAR_global_detection_enabled }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.11.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: mask account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - name: fmt (warning only)
        continue-on-error: true
        run: terraform fmt -check -recursive

      - name: init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode > plan.log 2>&1
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes, 1 = error
          {
            if [ "$code" -eq 0 ]; then
              echo "No changes."
            elif [ "$code" -eq 2 ]; then
              grep -E '^Plan:' plan.log | tail -1
              echo
              echo '```'
              grep -E '^  # .+ (will be|must be) ' plan.log | sed -E 's/^  # //'
              echo '```'
            else
              echo "Plan failed. 오류 부분만 표시 (전문은 로컬에서 terraform plan)"
              echo '```'
              { grep -E -A4 '^(│ )?Error' plan.log || tail -20 plan.log; } | tail -60
              echo '```'
            fi
          } | sed -E 's/[0-9]{12}/************/g' > plan-summary.md
          cat plan-summary.md
          rm -f plan.log
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Comment plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const p = `${process.env.TF_DIR}/plan-summary.md`;
            let summary = fs.existsSync(p) ? fs.readFileSync(p, 'utf8').trim() : '(no plan output)';
            if (summary.length > 60000) summary = summary.slice(0, 60000) + '\n…(생략)';
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n### Terraform plan (\`${process.env.TF_DIR}\`) — ${context.sha.slice(0, 7)}\n${summary}`;
            // 같은 PR에는 댓글 하나만 두고 새 커밋마다 고쳐 씀
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: context.issue.number });
            const old = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });

  apply:
    # Safety switch: set repository variable TF_APPLY_ENABLED=true to allow apply.
    if: github.event_name == 'push' && vars.TF_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production   # approval gate (Required reviewers) + OIDC subject for the apply role
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.11.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: mask account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - name: init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          terraform plan -no-color -out=tfplan > plan.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then { grep -E -A4 '^(│ )?Error' plan.log || tail -20 plan.log; } | tail -60 | sed -E 's/[0-9]{12}/************/g'; exit "$code"; fi
          grep -E '^Plan:|No changes' plan.log | tail -1
          grep -E '^  # .+ (will be|must be) ' plan.log | sed -E 's/^  # //; s/[0-9]{12}/************/g'
          rm -f plan.log

      - name: apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          terraform apply -no-color tfplan > apply.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then { grep -E -A4 '^(│ )?Error' apply.log || tail -20 apply.log; } | tail -60 | sed -E 's/[0-9]{12}/************/g'
          else grep -E '^Apply complete' apply.log; fi
          rm -f apply.log
          exit "$code"

  destroy:
    # Manual only. Needs TF_APPLY_ENABLED=true, input "destroy", and production Environment approval.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'destroy' && vars.TF_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.11.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: mask account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - name: init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          terraform destroy -no-color -auto-approve > destroy.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then { grep -E -A4 '^(│ )?Error' destroy.log || tail -20 destroy.log; } | tail -60 | sed -E 's/[0-9]{12}/************/g'
          else grep -E '^Destroy complete' destroy.log; fi
          rm -f destroy.log
          exit "$code"
